<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Classroom Allocation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Smart Classroom Allocation System</h1>
    </header>

    <main>
        <section id="allocation-form">
            <h2>Allocate Classroom</h2>
            <form id="classForm">
                <label for="className">Class Name / Subject:</label>
                <input type="text" id="className" placeholder="e.g. Computer Science" required>

                <label for="students">Number of Students:</label>
                <input type="number" id="students" placeholder="e.g. 60" required>

                <button type="submit">Allocate Room</button>
            </form>
        </section>

        <section id="result">
            <h2>Allocation Status</h2>
            <div id="output">No rooms allocated yet.</div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
